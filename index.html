<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16a34a">
<title>Mis Productos Súper</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header>
  <div class="top"><h1>🛒 Mis productos</h1><button id="account" class="ghost small" hidden></button></div>
  <div id="chips" class="chips"></div>
</header>

<main id="grid" class="grid"></main>
<p id="empty" class="empty" hidden></p>

<button id="add" class="fab" aria-label="Añadir producto"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></button>

<dialog id="auth-dlg">
  <div class="body">
    <h2>Tu cuenta</h2>
    <p class="muted">Entra para guardar tus productos en la nube y verlos en cualquier móvil.</p>
    <label class="f">Correo<input id="a-email" type="email" autocomplete="email"></label>
    <label class="f">Contraseña<input id="a-pass" type="password" autocomplete="current-password"></label>
    <p id="a-err" class="err"></p>
    <div class="row"><button id="a-login" type="button">Entrar</button><button id="a-create" type="button" class="ghost">Crear cuenta</button></div>
    <p class="links"><button id="a-reset" type="button" class="link">¿Olvidaste la contraseña?</button> · <button id="a-skip" type="button" class="link">Seguir sin cuenta</button></p>
  </div>
</dialog>

<dialog id="detail">
  <img id="d-img" alt="">
  <div class="body">
    <h2 id="d-name"></h2>
    <p id="d-meta" class="muted"></p>
    <p id="d-stars" class="stars"></p>
    <p id="d-price" class="price"></p>
    <p id="d-unit" class="muted"></p>
    <div id="d-note" class="note"></div>
    <div class="row">
      <button id="d-edit">Editar</button>
      <button id="d-del" class="danger">Borrar</button>
      <button id="d-close" class="ghost">Cerrar</button>
    </div>
  </div>
</dialog>

<dialog id="form-dlg">
  <form id="form" method="dialog">
    <h2 id="f-title">Nuevo producto</h2>
    <label class="photo">
      <img id="f-preview" alt="" hidden>
      <span id="f-photo-hint">📷 Hacer foto o elegir de la galería</span>
      <input id="f-photo" type="file" accept="image/*" hidden>
    </label>
    <label>Supermercado
      <input id="f-store" list="stores" required placeholder="Lidl, Mercadona…" autocomplete="off">
      <datalist id="stores"></datalist>
    </label>
    <label>Marca
      <input id="f-brand" placeholder="Hacendado, Deluxe…" autocomplete="off">
    </label>
    <label>Producto
      <input id="f-name" placeholder="Opcional" autocomplete="off">
    </label>
    <div class="row">
      <label>Precio (€)
        <input id="f-price" type="number" step="0.01" min="0" inputmode="decimal">
      </label>
      <label>Precio por (opcional)
        <div class="row tight">
          <input id="f-unitprice" type="number" step="0.01" min="0" inputmode="decimal" placeholder="€">
          <select id="f-unit"><option>kg</option><option>litro</option></select>
        </div>
      </label>
    </div>
    <div class="rate">Valoración
      <div id="f-stars" class="stars big" role="radiogroup"></div>
    </div>
    <label>Nota
      <textarea id="f-note" rows="3" placeholder="Muy salado, sabor fuerte, repetiría…"></textarea>
    </label>
    <div class="row">
      <button id="f-save" type="submit">Guardar</button>
      <button id="f-cancel" type="button" class="ghost">Cancelar</button>
    </div>
  </form>
</dialog>

<script src="firebase-config.js"></script>
<script src="app.js?v=6"></script>
</body>
</html>
